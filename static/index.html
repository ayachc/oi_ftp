<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>文件收发</title>
  <style>
    :root {
      color-scheme: light;
      --bg: #f4f7f5;
      --ink: #17211b;
      --muted: #65736b;
      --line: #dbe4de;
      --panel: #ffffff;
      --teal: #007f73;
      --teal-soft: #e2f5f1;
      --amber: #b56a00;
      --red: #c7362f;
      --shadow: 0 18px 45px rgba(23, 33, 27, .08);
    }
    * { box-sizing: border-box; }
    body {
      margin: 0;
      min-height: 100vh;
      font-family: ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", "Microsoft YaHei", sans-serif;
      background: linear-gradient(180deg, #eef7f1 0%, var(--bg) 38%, #f8faf8 100%);
      color: var(--ink);
    }
    button, input { font: inherit; }
    .app {
      max-width: 1360px;
      margin: 0 auto;
      padding: 22px 18px 28px;
    }
    header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      gap: 18px;
      margin-bottom: 16px;
    }
    h1 {
      margin: 0 0 6px;
      font-size: clamp(24px, 4vw, 38px);
      letter-spacing: 0;
    }
    .sub {
      margin: 0;
      color: var(--muted);
      line-height: 1.6;
    }
    .gear {
      width: 44px;
      height: 44px;
      border: 1px solid var(--line);
      border-radius: 10px;
      background: #fff;
      cursor: pointer;
      box-shadow: var(--shadow);
      font-size: 22px;
    }
    .gear.admin { color: #fff; background: var(--teal); border-color: var(--teal); }
    .grid {
      display: grid;
      grid-template-columns: repeat(2, minmax(0, 1fr));
      gap: 20px;
    }
    .panel {
      background: rgba(255, 255, 255, .92);
      border: 1px solid var(--line);
      border-radius: 14px;
      box-shadow: var(--shadow);
      min-height: calc(100vh - 150px);
      display: flex;
      flex-direction: column;
      overflow: hidden;
    }
    .panel.dragover {
      border-color: var(--teal);
      box-shadow: 0 0 0 4px var(--teal-soft), var(--shadow);
    }
    .panel-head {
      padding: 16px;
      display: flex;
      justify-content: space-between;
      align-items: flex-start;
      gap: 12px;
      border-bottom: 1px solid var(--line);
    }
    h2 {
      margin: 0 0 4px;
      font-size: 19px;
      letter-spacing: 0;
    }
    .hint {
      color: var(--muted);
      font-size: 13px;
    }
    .tools { display: flex; gap: 8px; flex-wrap: wrap; justify-content: flex-end; }
    .btn {
      border: 1px solid var(--line);
      background: #fff;
      color: var(--ink);
      min-height: 34px;
      padding: 0 12px;
      border-radius: 9px;
      cursor: pointer;
      transition: .16s ease;
      white-space: nowrap;
    }
    .btn.primary { background: var(--teal); border-color: var(--teal); color: #fff; }
    .btn.warn { color: var(--amber); }
    .btn.danger { color: var(--red); border-color: #f0c7c4; background: #fff8f7; }
    .btn:hover:not(:disabled) { transform: translateY(-1px); box-shadow: 0 8px 18px rgba(23, 33, 27, .1); }
    .btn:disabled {
      opacity: .38;
      cursor: not-allowed;
      transform: none;
      box-shadow: none;
    }
    .list {
      flex: 1;
      overflow: auto;
      padding: 10px;
    }
    .row {
      width: 100%;
      display: grid;
      grid-template-columns: minmax(0, 1fr) auto auto 42px;
      align-items: center;
      gap: 10px;
      border: 1px solid transparent;
      border-radius: 10px;
      padding: 11px 10px;
      min-height: 54px;
      transition: .14s ease;
    }
    .row.downloadable { cursor: pointer; }
    .row:hover {
      background: #f1f8f5;
      border-color: #d2e7de;
    }
    .name {
      min-width: 0;
      display: flex;
      align-items: center;
      gap: 9px;
      font-weight: 650;
    }
    .name-text {
      overflow: hidden;
      text-overflow: ellipsis;
      white-space: nowrap;
    }
    .meta {
      color: var(--muted);
      font-size: 13px;
      white-space: nowrap;
    }
    .del {
      height: 30px;
      border-radius: 8px;
      border: 1px solid #f0c7c4;
      color: var(--red);
      background: #fff8f7;
      cursor: pointer;
    }
    .del:disabled {
      opacity: .3;
      cursor: not-allowed;
      filter: grayscale(1);
    }
    .empty {
      color: var(--muted);
      height: 100%;
      display: grid;
      place-items: center;
      text-align: center;
      padding: 35px;
      line-height: 1.7;
    }
    .status {
      min-height: 28px;
      margin-top: 14px;
      color: var(--muted);
      font-size: 14px;
    }
    .modal {
      position: fixed;
      inset: 0;
      z-index: 40;
      background: rgba(13, 20, 17, .34);
      display: none;
      place-items: center;
      padding: 20px;
    }
    .modal.show { display: grid; }
    .dialog {
      width: min(390px, 100%);
      background: #fff;
      border-radius: 14px;
      border: 1px solid var(--line);
      box-shadow: var(--shadow);
      padding: 18px;
    }
    .dialog h3 { margin: 0 0 12px; font-size: 20px; }
    .dialog input {
      width: 100%;
      height: 42px;
      border: 1px solid var(--line);
      border-radius: 9px;
      padding: 0 11px;
      margin-bottom: 12px;
    }
    .dialog-actions { display: flex; gap: 8px; justify-content: flex-end; }
    .online-dock {
      position: fixed;
      top: 96px;
      right: 0;
      z-index: 20;
      display: flex;
      align-items: flex-start;
      transform: translateX(320px);
      transition: transform .2s ease;
    }
    .online-dock.open { transform: translateX(0); }
    .online-tab {
      writing-mode: vertical-rl;
      letter-spacing: 0;
      border: 1px solid var(--line);
      border-right: 0;
      border-radius: 10px 0 0 10px;
      background: var(--teal);
      color: #fff;
      min-height: 112px;
      padding: 12px 7px;
      cursor: pointer;
      box-shadow: var(--shadow);
    }
    .online-panel {
      width: 320px;
      max-height: calc(100vh - 125px);
      background: rgba(255, 255, 255, .96);
      border: 1px solid var(--line);
      border-radius: 12px 0 0 12px;
      box-shadow: var(--shadow);
      overflow: hidden;
      display: flex;
      flex-direction: column;
    }
    .online-head {
      padding: 13px;
      border-bottom: 1px solid var(--line);
      display: flex;
      justify-content: space-between;
      align-items: center;
      gap: 10px;
    }
    .online-title { font-weight: 750; }
    .online-cards {
      padding: 10px;
      overflow: auto;
      display: grid;
      grid-template-columns: repeat(2, minmax(0, 1fr));
      gap: 9px;
    }
    .online-card {
      border: 1px solid var(--line);
      border-radius: 9px;
      padding: 10px;
      min-height: 68px;
      cursor: pointer;
      text-align: left;
      transition: .14s ease;
      color: var(--ink);
      background: #eef7ff;
    }
    .online-card:hover { transform: translateY(-1px); box-shadow: 0 8px 18px rgba(23, 33, 27, .1); }
    .online-card.lagging { background: #fff7d8; }
    .online-card.offline { background: #edf0ee; color: #68726d; }
    .online-name {
      font-weight: 750;
      overflow: hidden;
      text-overflow: ellipsis;
      white-space: nowrap;
      margin-bottom: 8px;
    }
    .online-state {
      color: var(--muted);
      font-size: 12px;
    }
    .history-list {
      max-height: 320px;
      overflow: auto;
      border: 1px solid var(--line);
      border-radius: 9px;
      margin: 10px 0 12px;
    }
    .history-row {
      padding: 9px 10px;
      border-bottom: 1px solid var(--line);
      font-size: 13px;
      line-height: 1.55;
    }
    .history-row:last-child { border-bottom: 0; }
    @media (max-width: 820px) {
      .app { padding: 16px 10px 22px; }
      .grid { grid-template-columns: 1fr; }
      .panel { min-height: 460px; }
      .row { grid-template-columns: minmax(0, 1fr) 42px; }
      .row .meta { display: none; }
      header { align-items: flex-start; }
      .online-dock { top: 82px; transform: translateX(292px); }
      .online-panel { width: 292px; }
    }
  </style>
</head>
<body>
  <div class="app">
    <header>
      <div>
        <h1>文件收发</h1>
        <p class="sub" id="serverHint">连接同一局域网后，在浏览器打开本机 IP 和端口即可使用。</p>
      </div>
      <button class="gear" id="adminBtn" title="管理员模式">⚙</button>
    </header>

    <main class="grid">
      <section class="panel" id="downloadPanel">
        <div class="panel-head">
          <div>
            <h2>文件下载</h2>
            <div class="hint">点击文件名下载，仅管理员可上传</div>
          </div>
          <div class="tools">
            <button class="btn primary" id="downloadUploadBtn">上传</button>
          </div>
        </div>
        <div class="list" id="downloadList"></div>
      </section>

      <section class="panel" id="uploadPanel">
        <div class="panel-head">
          <div>
            <h2>文件上传</h2>
            <div class="hint">可拖入（或点击右侧按钮）上传文件、文件夹</div>
          </div>
          <div class="tools">
            <button class="btn" id="uploadFileBtn">文件</button>
            <button class="btn primary" id="uploadFolderBtn">文件夹</button>
            <button class="btn warn" id="downloadAllBtn">下载</button>
            <button class="btn danger" id="clearUploadBtn">清空</button>
          </div>
        </div>
        <div class="list" id="uploadList"></div>
      </section>
    </main>
    <div class="status" id="status"></div>
  </div>

  <aside class="online-dock" id="onlineDock">
    <button class="online-tab" id="onlineToggle">在线统计</button>
    <div class="online-panel">
      <div class="online-head">
        <div>
          <div class="online-title">在线统计</div>
          <div class="hint" id="onlineHint">未登记</div>
        </div>
        <button class="btn primary" id="registerBtn">登记</button>
      </div>
      <div class="online-cards" id="onlineCards"></div>
    </div>
  </aside>

  <input id="downloadInput" type="file" hidden>
  <input id="uploadFileInput" type="file" multiple hidden>
  <input id="uploadFolderInput" type="file" webkitdirectory directory multiple hidden>

  <div class="modal" id="modal">
    <div class="dialog">
      <h3 id="modalTitle">管理员登录</h3>
      <input id="passwordInput" type="password" placeholder="输入管理员密码" autocomplete="current-password">
      <div class="dialog-actions">
        <button class="btn" id="cancelLogin">取消</button>
        <button class="btn primary" id="confirmLogin">登录</button>
      </div>
    </div>
  </div>

  <div class="modal" id="infoModal">
    <div class="dialog">
      <h3 id="infoTitle">详情</h3>
      <div id="infoBody"></div>
      <div class="dialog-actions" id="infoActions">
        <button class="btn" id="closeInfo">关闭</button>
      </div>
    </div>
  </div>

  <script>
    const state = { isAdmin: false, limitMB: 5, download: [], upload: [] };
    const online = {
      open: false,
      registered: false,
      self: null,
      users: [],
      heartbeatIntervalSeconds: 3,
      heartbeatTimer: null,
      heartbeatTimerMs: 0,
      pollTimer: null,
      ws: null,
      wsActive: false,
      wsReconnectTimer: null,
    };
    const $ = (id) => document.getElementById(id);
    const statusEl = $("status");

    function setStatus(text, error = false) {
      statusEl.textContent = text || "";
      statusEl.style.color = error ? "#c7362f" : "#65736b";
    }
    function showError(text) {
      setStatus(text, true);
      alert(text);
    }
    function showSuccess(text) {
      setStatus(text);
      alert(text);
    }
    function formatSize(bytes) {
      if (bytes < 1024) return bytes + " B";
      if (bytes < 1024 * 1024) return (bytes / 1024).toFixed(1) + " KB";
      return (bytes / 1024 / 1024).toFixed(2) + " MB";
    }
    function icon(kind) { return kind === "folder" ? "📁" : "📄"; }
    async function api(url, options) {
      const res = await fetch(url, options);
      const type = res.headers.get("Content-Type") || "";
      if (type.includes("application/json")) {
        const data = await res.json();
        if (!res.ok || data.ok === false) throw new Error(data.error || "操作失败");
        return data;
      }
      if (!res.ok) throw new Error("操作失败");
      return res;
    }
    async function apiRaw(url, options) {
      const res = await fetch(url, options);
      const type = res.headers.get("Content-Type") || "";
      const data = type.includes("application/json") ? await res.json() : {};
      return { res, data };
    }
    async function refresh() {
      const data = await api("/api/state");
      state.isAdmin = data.is_admin;
      state.limitMB = data.file_size_limit_mb;
      state.download = data.download;
      state.upload = data.upload;
      render();
      renderOnline();
    }
    function renderList(area, items) {
      const list = $(area + "List");
      list.innerHTML = "";
      if (!items.length) {
        const empty = document.createElement("div");
        empty.className = "empty";
        empty.textContent = area === "download" ? "暂无可下载文件" : "暂无上传内容，拖入文件或文件夹即可上传";
        list.appendChild(empty);
        return;
      }
      for (const item of items) {
        const row = document.createElement("div");
        row.className = "row" + (area === "download" ? " downloadable" : "");
        row.title = area === "download" ? "点击下载" : item.name;
        row.innerHTML = `
          <div class="name"><span>${icon(item.kind)}</span><span class="name-text"></span></div>
          <div class="meta">${item.uploaded_at}</div>
          <div class="meta">${formatSize(item.size)}</div>
          <button class="del" title="删除">del</button>
        `;
        row.querySelector(".name-text").textContent = item.name;
        if (area === "download") {
          row.addEventListener("click", (ev) => {
            if (ev.target.closest("button")) return;
            window.location.href = "/api/download?path=" + encodeURIComponent(item.path);
          });
        }
        const del = row.querySelector(".del");
        del.disabled = !item.can_delete;
        del.addEventListener("click", async (ev) => {
          ev.stopPropagation();
          if (!item.can_delete) return;
          if (!confirm("确定删除 " + item.name + " 吗？")) return;
          try {
            await api("/api/delete", {
              method: "POST",
              headers: { "Content-Type": "application/json" },
              body: JSON.stringify({ area, path: item.path })
            });
            setStatus("已删除：" + item.name);
            await refresh();
          } catch (err) {
            setStatus(err.message, true);
          }
        });
        list.appendChild(row);
      }
    }
    function render() {
      $("adminBtn").classList.toggle("admin", state.isAdmin);
      $("adminBtn").title = state.isAdmin ? "已进入管理员模式，点击退出" : "管理员模式";
      $("downloadUploadBtn").disabled = !state.isAdmin;
      $("downloadAllBtn").disabled = !state.isAdmin;
      $("clearUploadBtn").disabled = !state.isAdmin || state.upload.length === 0;
      renderList("download", state.download);
      renderList("upload", state.upload);
    }
    function statusText(status) {
      if (status === "online") return "在线";
      if (status === "lagging") return "卡顿";
      return "离线";
    }
    function renderOnline() {
      $("onlineDock").classList.toggle("open", online.open);
      $("registerBtn").textContent = online.registered ? "改名" : "登记";
      $("onlineHint").textContent = online.registered && online.self ? online.self.name : "未登记";
      const cards = $("onlineCards");
      cards.innerHTML = "";
      if (!online.users.length) {
        const empty = document.createElement("div");
        empty.className = "empty";
        empty.style.gridColumn = "1 / -1";
        empty.textContent = "暂无登记用户";
        cards.appendChild(empty);
        return;
      }
      for (const user of online.users) {
        const card = document.createElement("button");
        card.className = "online-card " + user.status;
        card.innerHTML = `
          <div class="online-name"></div>
          <div class="online-state">${statusText(user.status)}</div>
        `;
        card.querySelector(".online-name").textContent = user.name;
        card.addEventListener("click", () => showUserHistory(user.id));
        cards.appendChild(card);
      }
    }
    async function refreshOnline() {
      const data = await api("/api/online-state");
      online.registered = data.registered;
      online.self = data.self;
      online.users = data.users || [];
      online.heartbeatIntervalSeconds = data.heartbeat_interval_seconds || 3;
      renderOnline();
      startOnlineChannel();
    }
    function clearHeartbeatTimer() {
      if (online.heartbeatTimer) {
        clearInterval(online.heartbeatTimer);
        online.heartbeatTimer = null;
        online.heartbeatTimerMs = 0;
      }
    }
    function syncHeartbeatTimer() {
      if (online.wsActive || (online.ws && "WebSocket" in window && online.ws.readyState === WebSocket.CONNECTING)) {
        clearHeartbeatTimer();
        return;
      }
      const nextMs = online.heartbeatIntervalSeconds * 1000;
      if (online.heartbeatTimer && (!online.registered || !online.self || online.heartbeatTimerMs !== nextMs)) {
        clearHeartbeatTimer();
      }
      if (!online.registered || !online.self || online.heartbeatTimer) return;
      online.heartbeatTimerMs = nextMs;
      online.heartbeatTimer = setInterval(sendHeartbeat, nextMs);
    }
    function closeOnlineSocket() {
      if (online.ws) {
        online.ws.onopen = null;
        online.ws.onmessage = null;
        online.ws.onclose = null;
        online.ws.onerror = null;
        try { online.ws.close(); } catch (err) {}
      }
      online.ws = null;
      online.wsActive = false;
      if (online.wsReconnectTimer) {
        clearTimeout(online.wsReconnectTimer);
        online.wsReconnectTimer = null;
      }
    }
    function handleOnlineRejected(message) {
      online.registered = false;
      online.self = null;
      closeOnlineSocket();
      clearHeartbeatTimer();
      refreshOnline().catch(err => setStatus(err.message, true));
      showError(message || "登记已失效");
    }
    function startOnlineChannel() {
      if (!online.registered || !online.self) {
        closeOnlineSocket();
        clearHeartbeatTimer();
        return;
      }
      if (!("WebSocket" in window)) {
        syncHeartbeatTimer();
        return;
      }
      if (online.ws && (online.ws.readyState === WebSocket.OPEN || online.ws.readyState === WebSocket.CONNECTING)) {
        syncHeartbeatTimer();
        return;
      }
      const scheme = location.protocol === "https:" ? "wss" : "ws";
      const ws = new WebSocket(`${scheme}://${location.host}/api/online-ws`);
      online.ws = ws;
      syncHeartbeatTimer();
      ws.onopen = () => {
        if (online.ws !== ws) return;
        online.wsActive = true;
        clearHeartbeatTimer();
      };
      ws.onmessage = (ev) => {
        let data = {};
        try { data = JSON.parse(ev.data); } catch (err) {}
        if (data.rejected) handleOnlineRejected(data.error);
      };
      ws.onclose = () => {
        if (online.ws !== ws) return;
        online.ws = null;
        online.wsActive = false;
        syncHeartbeatTimer();
        if (online.registered && online.self && !online.wsReconnectTimer) {
          online.wsReconnectTimer = setTimeout(() => {
            online.wsReconnectTimer = null;
            startOnlineChannel();
          }, online.heartbeatIntervalSeconds * 1000);
        }
      };
      ws.onerror = () => {
        if (online.ws === ws) ws.close();
      };
    }
    async function sendHeartbeat() {
      if (!online.registered || !online.self) return;
      const { res, data } = await apiRaw("/api/online-heartbeat", {
        method: "POST",
        headers: { "Content-Type": "application/json" },
        body: JSON.stringify({ id: online.self.id, name: online.self.name })
      });
      if (data.rejected) {
        handleOnlineRejected(data.error);
        return;
      }
      if (!res.ok || data.ok === false) {
        setStatus(data.error || "心跳发送失败", true);
        return;
      }
      online.self = data.user || online.self;
    }
    async function registerOnline() {
      const currentName = online.self?.name || "";
      const name = prompt("请输入名字（最多 20 个字符）", currentName);
      if (name === null) return;
      try {
        await api("/api/online-register", {
          method: "POST",
          headers: { "Content-Type": "application/json" },
          body: JSON.stringify({ name })
        });
        await refreshOnline();
        if (!online.wsActive) await sendHeartbeat();
        setStatus("登记成功：" + name.trim());
      } catch (err) {
        showError(err.message);
      }
    }
    async function showUserHistory(userId) {
      try {
        const data = await api("/api/online-user?id=" + encodeURIComponent(userId));
        const user = data.user;
        $("infoTitle").textContent = user.name;
        const rows = user.history.length ? user.history.map(item => {
          const end = item.end || "至今";
          return `<div class="history-row"><strong>${statusText(item.status)}</strong><br>${item.start} - ${end}</div>`;
        }).join("") : '<div class="history-row">暂无历史记录</div>';
        $("infoBody").innerHTML = `<div class="hint">当前状态：${statusText(user.status)}，最后心跳：${user.last_seen}</div><div class="history-list">${rows}</div>`;
        const actions = $("infoActions");
        actions.innerHTML = "";
        if (state.isAdmin) {
          const del = document.createElement("button");
          del.className = "btn danger";
          del.textContent = "删除";
          del.addEventListener("click", () => deleteOnlineUser(user.id, user.name));
          actions.appendChild(del);
        }
        const close = document.createElement("button");
        close.className = "btn";
        close.textContent = "关闭";
        close.addEventListener("click", () => $("infoModal").classList.remove("show"));
        actions.appendChild(close);
        $("infoModal").classList.add("show");
      } catch (err) {
        showError(err.message);
      }
    }
    async function deleteOnlineUser(userId, name) {
      if (!confirm("确定删除 " + name + " 的登记吗？")) return;
      try {
        await api("/api/online-delete", {
          method: "POST",
          headers: { "Content-Type": "application/json" },
          body: JSON.stringify({ id: userId })
        });
        $("infoModal").classList.remove("show");
        await refreshOnline();
        setStatus("已删除登记：" + name);
      } catch (err) {
        showError(err.message);
      }
    }
    function totalSize(files) {
      return files.reduce((sum, f) => sum + f.size, 0);
    }
    function appendFiles(form, files) {
      for (const file of files) {
        const rel = file.relativePath || file.webkitRelativePath || file.name;
        form.append("files", file, rel);
      }
    }
    async function uploadFiles(area, files) {
      if (!files.length) return;
      if (area === "download") {
        const rel = files[0]?.relativePath || files[0]?.webkitRelativePath || files[0]?.name || "";
        if (files.length !== 1 || rel.includes("/") || rel.includes("\\")) {
          showError("左侧下载列表只能上传单个文件");
          return;
        }
      }
      const total = totalSize(files);
      if (total > state.limitMB * 1024 * 1024) {
        showError(`上传内容超过 ${state.limitMB} MB 限制`);
        return;
      }
      const form = new FormData();
      appendFiles(form, files);
      setStatus("正在上传 " + files.length + " 个文件...");
      try {
        const result = await api("/api/upload?area=" + area, { method: "POST", body: form });
        const count = result.saved?.length || files.length;
        const summary = count === 1 ? (result.saved?.[0] || files[0].name) : `${count} 个文件`;
        showSuccess("成功上传了 " + summary);
        await refresh();
      } catch (err) {
        showError(err.message);
      }
    }
    async function readEntry(entry, prefix = "") {
      if (entry.isFile) {
        return new Promise((resolve, reject) => {
          entry.file((file) => {
            file.relativePath = prefix + file.name;
            resolve([file]);
          }, reject);
        });
      }
      if (entry.isDirectory) {
        const reader = entry.createReader();
        const all = [];
        async function readBatch() {
          const entries = await new Promise((resolve, reject) => reader.readEntries(resolve, reject));
          if (!entries.length) return;
          for (const child of entries) {
            all.push(...await readEntry(child, prefix + entry.name + "/"));
          }
          await readBatch();
        }
        await readBatch();
        return all;
      }
      return [];
    }
    async function filesFromDrop(ev) {
      const items = [...ev.dataTransfer.items || []];
      if (items.length && items[0].webkitGetAsEntry) {
        const files = [];
        for (const item of items) {
          const entry = item.webkitGetAsEntry();
          if (entry) files.push(...await readEntry(entry));
        }
        return files;
      }
      return [...ev.dataTransfer.files || []];
    }
    $("downloadUploadBtn").addEventListener("click", () => {
      if (state.isAdmin) $("downloadInput").click();
    });
    $("downloadInput").addEventListener("change", (ev) => uploadFiles("download", [...ev.target.files]).then(() => ev.target.value = ""));
    $("uploadFileBtn").addEventListener("click", () => $("uploadFileInput").click());
    $("uploadFolderBtn").addEventListener("click", () => $("uploadFolderInput").click());
    $("uploadFileInput").addEventListener("change", (ev) => uploadFiles("upload", [...ev.target.files]).then(() => ev.target.value = ""));
    $("uploadFolderInput").addEventListener("change", (ev) => uploadFiles("upload", [...ev.target.files]).then(() => ev.target.value = ""));
    $("downloadAllBtn").addEventListener("click", () => {
      if (state.isAdmin) window.location.href = "/api/download-uploads";
    });
    $("clearUploadBtn").addEventListener("click", async () => {
      if (!state.isAdmin || !state.upload.length) return;
      if (!confirm("确定删除右侧上传列表中的全部内容吗？")) return;
      try {
        await api("/api/clear-uploads", { method: "POST" });
        setStatus("已清空上传列表");
        await refresh();
      } catch (err) {
        showError(err.message);
      }
    });
    $("adminBtn").addEventListener("click", async () => {
      if (state.isAdmin) {
        await api("/api/logout", { method: "POST" });
        setStatus("已退出管理员模式");
        await refresh();
        return;
      }
      $("modal").classList.add("show");
      $("passwordInput").focus();
    });
    $("cancelLogin").addEventListener("click", () => $("modal").classList.remove("show"));
    $("confirmLogin").addEventListener("click", async () => {
      try {
        await api("/api/login", {
          method: "POST",
          headers: { "Content-Type": "application/json" },
          body: JSON.stringify({ password: $("passwordInput").value })
        });
        $("passwordInput").value = "";
        $("modal").classList.remove("show");
        setStatus("已进入管理员模式");
        await refresh();
      } catch (err) {
        setStatus(err.message, true);
      }
    });
    $("passwordInput").addEventListener("keydown", (ev) => {
      if (ev.key === "Enter") $("confirmLogin").click();
      if (ev.key === "Escape") $("modal").classList.remove("show");
    });
    $("onlineToggle").addEventListener("click", () => {
      online.open = !online.open;
      renderOnline();
      if (online.open) refreshOnline().catch(err => setStatus(err.message, true));
    });
    $("registerBtn").addEventListener("click", registerOnline);
    $("closeInfo").addEventListener("click", () => $("infoModal").classList.remove("show"));
    function bindDrop(panel, area, requireAdmin = false) {
      ["dragenter", "dragover"].forEach(name => panel.addEventListener(name, (ev) => {
        ev.preventDefault();
        if (!requireAdmin || state.isAdmin) panel.classList.add("dragover");
      }));
      ["dragleave", "drop"].forEach(name => panel.addEventListener(name, (ev) => {
        ev.preventDefault();
        if (name !== "drop") panel.classList.remove("dragover");
      }));
      panel.addEventListener("drop", async (ev) => {
        panel.classList.remove("dragover");
        if (requireAdmin && !state.isAdmin) {
          setStatus("需要管理员权限才能上传到左侧列表", true);
          return;
        }
        try {
          const files = await filesFromDrop(ev);
          await uploadFiles(area, files);
        } catch (err) {
          showError("浏览器未能读取拖入的文件或文件夹");
        }
      });
    }
    bindDrop($("downloadPanel"), "download", true);
    bindDrop($("uploadPanel"), "upload");
    refresh().catch(err => setStatus(err.message, true));
    refreshOnline().catch(err => setStatus(err.message, true));
    online.pollTimer = setInterval(() => refreshOnline().catch(err => setStatus(err.message, true)), 3000);
  </script>
</body>
</html>
